<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102e2a"/>
      <stop offset="100%" stop-color="#143731"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ceff8c"/>
      <stop offset="100%" stop-color="#9fe26a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="176" height="176" rx="34" fill="url(#bg)"/>
  <rect x="18" y="18" width="156" height="156" rx="28" fill="none" stroke="url(#ring)" stroke-width="10" filter="url(#glow)"/>

  <g fill="none" stroke="#ceff8c" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M56 135 V57 L136 135 V57" stroke-width="16"/>
    <path d="M56 135 L136 57" stroke="#e7ffb8" stroke-width="7" opacity="0.95"/>
  </g>

  <circle cx="56" cy="57" r="5" fill="#e7ffb8"/>
  <circle cx="136" cy="57" r="5" fill="#e7ffb8"/>
  <circle cx="56" cy="135" r="5" fill="#e7ffb8"/>
  <circle cx="136" cy="135" r="5" fill="#e7ffb8"/>
</svg>