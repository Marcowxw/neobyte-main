<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Setup NeoByte Pro</title>
  <desc id="desc">Escena de setup gamer con monitor, teclado y gabinete RGB.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2f29"/>
      <stop offset="60%" stop-color="#15423a"/>
      <stop offset="100%" stop-color="#1d5b4f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ceff8c"/>
      <stop offset="100%" stop-color="#8bd85a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <circle cx="960" cy="120" r="180" fill="#ceff8c" opacity="0.18"/>
  <circle cx="180" cy="680" r="220" fill="#ceff8c" opacity="0.12"/>
  <rect x="160" y="490" width="880" height="28" rx="14" fill="#0d2622"/>
  <rect x="280" y="190" width="540" height="310" rx="24" fill="#0a221e" stroke="#2d7a69" stroke-width="6"/>
  <rect x="310" y="220" width="480" height="245" rx="16" fill="#081b18"/>
  <path d="M335 390C430 310 520 420 620 345C680 300 735 310 780 340V460H335Z" fill="url(#accent)" opacity="0.9"/>
  <rect x="520" y="500" width="60" height="36" rx="8" fill="#123831"/>
  <rect x="440" y="535" width="220" height="20" rx="10" fill="#0b2622"/>
  <rect x="865" y="230" width="130" height="275" rx="20" fill="#0c231f" stroke="#2d7a69" stroke-width="4"/>
  <rect x="895" y="265" width="70" height="120" rx="10" fill="#122f2a"/>
  <circle cx="930" cy="420" r="26" fill="none" stroke="#ceff8c" stroke-width="5" filter="url(#glow)"/>
  <rect x="355" y="560" width="170" height="85" rx="18" fill="#0c231f" stroke="#2b7161" stroke-width="4"/>
  <rect x="540" y="560" width="280" height="85" rx="18" fill="#0c231f" stroke="#2b7161" stroke-width="4"/>
  <g fill="#ceff8c" opacity="0.85">
    <rect x="378" y="588" width="20" height="20" rx="4"/>
    <rect x="410" y="588" width="20" height="20" rx="4"/>
    <rect x="442" y="588" width="20" height="20" rx="4"/>
    <rect x="574" y="586" width="26" height="26" rx="6"/>
    <rect x="607" y="586" width="26" height="26" rx="6"/>
    <rect x="640" y="586" width="26" height="26" rx="6"/>
    <rect x="673" y="586" width="26" height="26" rx="6"/>
  </g>
  <text x="90" y="110" fill="#e9ffd0" font-family="Rajdhani, Arial, sans-serif" font-size="46" font-weight="700">Setup NeoByte Pro</text>
</svg>
